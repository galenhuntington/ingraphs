[package]
name = "graphy"
version = "0.1.0"
edition = "2024"
# this doesn't work with [[bin]] below
# autobins = true

# [[bin]]
# name = "graphy"
# path = "src/main.rs"

# Warns me about same path.
# [[bin]]
# name = "graphy-u64"
# path = "src/main.rs"
# required-features = ["u64"]

[profile.release]
lto = true
codegen-units = 1

[features]
default = ["nauty"]
# Exact native isomorphism keys; disable for the pure-Rust fallback.
nauty = ["dep:cc"]
# Optimize the C backend for the build machine (not a portable binary).
native = ["nauty"]
u64 = []

[build-dependencies]
cc = { version = "1.2.0", optional = true }

[dependencies]
auto_ops = "0.3.0"
itertools = "0.12.0"
rand = "0.8.5"
rand_distr = "0.4.3"
fix_fn = "1.0.2"
utc-dt = "0.3.0"
clap = { version = "4.5.28", features = ["derive"] }
rayon = "1.10.0"
dashmap = "6.1.0"
